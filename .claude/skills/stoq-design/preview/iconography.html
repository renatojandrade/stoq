<!-- @dsCard group="Brand" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { padding: 20px 24px; }
  .head { font:var(--body-small); color:var(--on-surface-variant); margin-bottom:14px; }
  .head b { color:var(--on-surface); font-weight:500; }
  .grid { display:grid; grid-template-columns:repeat(8,1fr); gap:16px 8px; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .ic .mdi { font-size:26px; color:var(--on-surface); }
  .ic .n { font:10px/1.2 var(--font-sans); color:var(--on-surface-variant); text-align:center; }
</style>
</head>
<body>
  <div class="head"><b>Material Community Icons</b> · @expo/vector-icons · outline default, filled when active</div>
  <div class="grid">
    <div class="ic"><span class="mdi mdi-fridge"></span><span class="n">fridge</span></div>
    <div class="ic"><span class="mdi mdi-cart"></span><span class="n">cart</span></div>
    <div class="ic"><span class="mdi mdi-barcode-scan"></span><span class="n">barcode-scan</span></div>
    <div class="ic"><span class="mdi mdi-qrcode-scan"></span><span class="n">qrcode-scan</span></div>
    <div class="ic"><span class="mdi mdi-package-variant"></span><span class="n">package-variant</span></div>
    <div class="ic"><span class="mdi mdi-account-circle"></span><span class="n">account-circle</span></div>
    <div class="ic"><span class="mdi mdi-calendar-alert"></span><span class="n">calendar-alert</span></div>
    <div class="ic"><span class="mdi mdi-receipt-text-outline"></span><span class="n">receipt-text</span></div>
    <div class="ic"><span class="mdi mdi-cart-plus"></span><span class="n">cart-plus</span></div>
    <div class="ic"><span class="mdi mdi-plus-circle-outline"></span><span class="n">plus-circle</span></div>
    <div class="ic"><span class="mdi mdi-minus-circle-outline"></span><span class="n">minus-circle</span></div>
    <div class="ic"><span class="mdi mdi-trash-can-outline"></span><span class="n">trash-can</span></div>
    <div class="ic"><span class="mdi mdi-pencil-outline"></span><span class="n">pencil</span></div>
    <div class="ic"><span class="mdi mdi-filter-variant"></span><span class="n">filter-variant</span></div>
    <div class="ic"><span class="mdi mdi-home-account"></span><span class="n">home-account</span></div>
    <div class="ic"><span class="mdi mdi-chevron-right"></span><span class="n">chevron-right</span></div>
  </div>
</body>
</html>
