<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { padding: 24px; display:flex; gap:16px; flex-wrap:wrap; }
  .field { flex:1; min-width:180px; }
  .inp { position:relative; height:48px; border:1px solid var(--outline); border-radius:4px; display:flex; align-items:center; padding:0 12px; }
  .inp.focus { border:2px solid var(--primary); }
  .inp.err { border:2px solid var(--error); }
  .lbl { position:absolute; top:-9px; left:10px; background:#fff; padding:0 5px; font:var(--body-small); }
  .inp.focus .lbl { color:var(--primary); }
  .inp.err .lbl { color:var(--error); }
  .val { font:var(--body-large); color:var(--on-surface); }
  .ph { font:var(--body-large); color:var(--outline); }
  .mdi-tr { margin-left:auto; color:var(--on-surface-variant); }
  .help { font:var(--body-small); color:var(--error); margin-top:5px; padding-left:4px; }
  .help.ok { color:var(--on-surface-variant); }
</style>
</head>
<body>
  <div class="field">
    <div class="inp focus"><span class="lbl">E-mail</span><span class="val">ana@email.com</span></div>
    <div class="help ok">Digite seu e-mail de cadastro.</div>
  </div>
  <div class="field">
    <div class="inp"><span class="lbl" style="color:var(--on-surface-variant)">Senha</span><span class="ph">••••••••</span><span class="mdi mdi-eye mdi-tr"></span></div>
    <div class="help ok">&nbsp;</div>
  </div>
  <div class="field">
    <div class="inp err"><span class="lbl">Data de validade</span><span class="val">2026/13</span></div>
    <div class="help">A data deve estar no formato AAAA-MM-DD.</div>
  </div>
</body>
</html>
