<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { padding: 22px 24px; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; }
  .spec .lab { width: 130px; flex: none; color: var(--on-surface-variant); font: var(--body-small); }
  .spec .sample { color: var(--on-surface); }
</style>
</head>
<body>
  <div class="spec"><span class="lab">Headline Medium</span><span class="sample" style="font:var(--headline-medium)">Bem-vindo de volta</span></div>
  <div class="spec"><span class="lab">Headline Small</span><span class="sample" style="font:var(--headline-small)">2 Litros</span></div>
  <div class="spec"><span class="lab">Title Large · 500</span><span class="sample" style="font:var(--title-large)">Família Silva</span></div>
  <div class="spec"><span class="lab">Title Medium · 500</span><span class="sample" style="font:var(--title-medium)">Seu estoque está vazio</span></div>
  <div class="spec"><span class="lab">Body Large</span><span class="sample" style="font:var(--body-large)">Leite integral</span></div>
  <div class="spec"><span class="lab">Body Medium</span><span class="sample" style="font:var(--body-medium)">Tio João · Arroz</span></div>
  <div class="spec"><span class="lab">Body Small</span><span class="sample" style="font:var(--body-small)">Venc. 12/06/2026 · 2 lotes</span></div>
  <div class="spec"><span class="lab">Label Large · 500</span><span class="sample" style="font:var(--label-large)">ADICIONAR AO ESTOQUE</span></div>
</body>
</html>
